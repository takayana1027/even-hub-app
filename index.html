<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Even G2 Sales Hub</title>
<style>
  body {
    background-color: #000000;
    color: #00FF66;
    font-family: sans-serif;
    margin: 0; padding: 10px;
    overflow: hidden; user-select: none;
  }
  #glass-view { display: flex; justify-content: space-between; height: 100vh; }
  #left-panel { width: 35%; font-size: 16px; font-weight: bold; }
  #right-panel { width: 60%; font-size: 15px; overflow-y: hidden; position: relative; }
  .item { padding: 4px; margin-bottom: 2px; border-left: 3px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.selected { border-left: 3px solid #00FF66; background-color: rgba(0, 255, 102, 0.15); font-weight: bold; }
  .section-title { font-size: 12px; color: #88ffaa; margin-top: 6px; border-bottom: 1px solid #00FF66; }
  #memo-view { display: none; white-space: pre-wrap; line-height: 1.4; }
  #auth-btn { background: #00FF66; color: #000; padding: 10px; border: none; font-weight: bold; border-radius: 4px; cursor: pointer; }
  #status-msg { font-size: 13px; color: #ffcc00; margin-top: 8px; white-space: pre-wrap; line-height: 1.4; }
</style>
</head>
<body>

<div id="glass-view">
  <div id="left-panel">
    <div id="clock">--/-- --:--</div>
  </div>
  <div id="right-panel">
    <button id="auth-btn" onclick="handleAuthClick()">Googleログイン (v2)</button>
    <div id="status-msg"></div>
    <div id="list-view"></div>
    <div id="memo-view"></div>
  </div>
</div>

<script>
  const CLIENT_ID = '162909982456-9oocq2tnj9qfr69g75ghs8cgba0q1ali.apps.googleusercontent.com';
  const REDIRECT_URI = 'https://takayana1027.github.io/even-hub-app/';
  const SCOPES = 'https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks';

  let accessToken = null;
  let schedules = [];
  let todos = [];
  let currentMode = "LIST";
  let cursorIndex = 0;

  function setStatus(msg) {
    const el = document.getElementById('status-msg');
    if (el) el.innerText = msg;
  }

  function handleAuthClick() {
    setStatus("Googleのログイン画面へ移動しています...");
    const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=${encodeURIComponent(SCOPES)}&prompt=consent`;
    window.location.href = authUrl;
  }

  window.onload = async () => {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    if (params.has('access_token')) {
      accessToken = params.get('access_token');
      window.history.replaceState({}, document.title, window.location.pathname);
      document.getElementById('auth-btn').style.display = 'none';
      setStatus("予定とToDoを読み込み中...");
      await fetchData();
    } else if (params.has('error')) {
      setStatus("ログインエラー: " + params.get('error'));
    } else {
      setStatus("上の「Googleログイン (v2)」を押してください");
    }
  };

  async function fetchData() {
    let errors = [];
    const headers = { 'Authorization': 'Bearer ' + accessToken };

    try {
      const timeMin = encodeURIComponent((new Date()).toISOString());
      const calRes = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin}&showDeleted=false&singleEvents=true&maxResults=4&orderBy=startTime`, { headers });
      const calData = await calRes.json();
      if (!calRes.ok) throw new Error(calData.error ? calData.error.message : 'Calendar Error');
      schedules = (calData.items || []).map(i => i.summary || '予定あり');
    } catch (err) {
      errors.push("カレンダー取得失敗: " + err.message);
    }

    try {
      const taskRes = await fetch(`https://tasks.googleapis.com/tasks/v1/lists/@default/tasks?showCompleted=false&maxResults=4`, { headers });
      const taskData = await taskRes.json();
      if (!taskRes.ok) throw new Error(taskData.error ? taskData.error.message : 'Tasks Error');
      todos = taskData.items ? taskData.items : [];
    } catch (err) {
      errors.push("ToDo取得失敗: " + err.message);
    }

    setStatus(errors.length > 0 ? errors.join("\n") : "");
    render();
  }

  function render() {
    const listView = document.getElementById('list-view');
    const memoView = document.getElementById('memo-view');
    if (currentMode === "STEALTH") {
      listView.style.display = "none"; memoView.style.display = "none"; return;
    }
    if (currentMode === "MEMO") {
      listView.style.display = "none"; memoView.style.display = "block";
      memoView.innerText = "【面談メモ】\nここにスマホから入力したメモが表示されます。";
    } else {
      listView.style.display = "block"; memoView.style.display = "none";
      let html = `<div class="item ${cursorIndex === 0 ? 'selected' : ''}">📄 面談メモを開く</div>`;
      html += `<div class="section-title">■ 予定</div>`;
      if (schedules.length === 0) html += `<div class="item">予定なし</div>`;
      schedules.forEach((title, idx) => {
        html += `<div class="item ${cursorIndex === idx+1 ? 'selected' : ''}">${title}</div>`;
      });
      html += `<div class="section-title">■ TELリスト</div>`;
      if (todos.length === 0) html += `<div class="item">タスクなし</div>`;
      todos.forEach((task, idx) => {
        html += `<div class="item ${cursorIndex === idx+1+schedules.length ? 'selected' : ''}">☐ ${task.title}</div>`;
      });
      listView.innerHTML = html;
    }
  }

  document.addEventListener('keydown', (e) => {
    let totalItems = 1 + schedules.length + todos.length;
    if(e.key === 'ArrowUp') { cursorIndex = Math.max(0, cursorIndex - 1); render(); }
    if(e.key === 'ArrowDown') { cursorIndex = Math.min(totalItems - 1, cursorIndex + 1); render(); }
    if(e.key === 'Enter') {
      if(currentMode === "STEALTH") { currentMode = "LIST"; render(); return; }
      if(cursorIndex === 0) { currentMode = "MEMO"; render(); }
      else if(cursorIndex > schedules.length) {
        let task = todos[cursorIndex - 1 - schedules.length];
        if (task && accessToken) {
          fetch(`https://tasks.googleapis.com/tasks/v1/lists/@default/tasks/${task.id}`, {
            method: 'PATCH',
            headers: {
              'Authorization': 'Bearer ' + accessToken,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ status: 'completed' })
          }).then(() => {
            todos.splice(cursorIndex - 1 - schedules.length, 1);
            render();
          });
        }
      }
    }
    if(e.key === 'Backspace') {
      if(currentMode === "MEMO") currentMode = "LIST";
      else if(currentMode === "LIST") currentMode = "STEALTH";
      render();
    }
  });

  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').innerText = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }, 1000);
</script>
</body>
</html>
