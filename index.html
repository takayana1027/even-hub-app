<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Even G2 Sales Hub</title>
<style>
  body {
    background-color: #000000;
    color: #00FF66;
    font-family: sans-serif;
    margin: 0; padding: 10px;
    overflow: hidden; user-select: none;
  }
  #glass-view { display: flex; justify-content: space-between; height: 100vh; }
  #left-panel { width: 35%; font-size: 16px; font-weight: bold; }
  #right-panel { width: 60%; font-size: 15px; overflow-y: hidden; position: relative; }
  .item { padding: 4px; margin-bottom: 2px; border-left: 3px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.selected { border-left: 3px solid #00FF66; background-color: rgba(0, 255, 102, 0.15); font-weight: bold; }
  .section-title { font-size: 12px; color: #88ffaa; margin-top: 6px; border-bottom: 1px solid #00FF66; }
  #memo-view { display: none; white-space: pre-wrap; line-height: 1.4; }
  #auth-btn { background: #00FF66; color: #000; padding: 10px; border: none; font-weight: bold; border-radius: 4px; display: none; cursor: pointer; }
  #status-msg { font-size: 13px; color: #ffcc00; margin-top: 8px; white-space: pre-wrap; line-height: 1.4; }
</style>
</head>
<body>

<div id="glass-view">
  <div id="left-panel">
    <div id="clock">--/-- --:--</div>
  </div>
  <div id="right-panel">
    <button id="auth-btn" onclick="handleAuthClick()">Googleログイン</button>
    <div id="status-msg">初期化中...</div>
    <div id="list-view"></div>
    <div id="memo-view"></div>
  </div>
</div>

<script>
// ==========================================
  // 【設定箇所】ここに取得したキーを貼り付けます
  // ==========================================
  const API_KEY = 'AIzaSyAD_hguxSy00WhV_qc9iZ6WLf14l8gYkUM';
  const CLIENT_ID = '162909982456-9oocq2tnj9qfr69g75ghs8cgba0q1ali.apps.googleusercontent.com';
  // ==========================================

  const DISCOVERY_DOCS = [
    "https://www.googleapis.com/discovery/v1/apis/calendar/v3/rest",
    "https://www.googleapis.com/discovery/v1/apis/tasks/v1/rest"
  ];
  const SCOPES = "https://www.googleapis.com/auth/calendar.readonly https://www.googleapis.com/auth/tasks";

  let tokenClient;
  let gapiInited = false;
  let gisInited = false;
  let schedules = [];
  let todos = [];
  let currentMode = "LIST";
  let cursorIndex = 0;

  function setStatus(msg) {
    const el = document.getElementById('status-msg');
    if (el) el.innerText = msg;
  }

  function gapiLoaded() {
    gapi.load('client', initializeGapiClient);
  }

  async function initializeGapiClient() {
    try {
      await gapi.client.init({ apiKey: API_KEY, discoveryDocs: DISCOVERY_DOCS });
      gapiInited = true;
      maybeEnableButtons();
    } catch (err) {
      setStatus("APIキーエラー:\n" + (err.result ? err.result.error.message : JSON.stringify(err)));
    }
  }

  function gisLoaded() {
    try {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: async (resp) => {
          if (resp.error !== undefined) {
            setStatus("ログインエラー: " + JSON.stringify(resp));
            return;
          }
          // 取得したアクセストークンをGAPIに明示的にセット
          gapi.client.setToken(resp);
          document.getElementById('auth-btn').style.display = 'none';
          setStatus("予定とToDoを読み込み中...");
          await fetchData();
        },
      });
      gisInited = true;
      maybeEnableButtons();
    } catch (err) {
      setStatus("クライアントIDエラー:\n" + err.message);
    }
  }

  function maybeEnableButtons() {
    if (gapiInited && gisInited) {
      document.getElementById('auth-btn').style.display = 'block';
      setStatus("上の「Googleログイン」を押してください");
    }
  }

  function handleAuthClick() {
    setStatus("別ウィンドウでログイン中...\n一番下までスクロールして「続行」を押してください。");
    tokenClient.requestAccessToken({prompt: 'consent'});
  }

  async function fetchData() {
    let errors = [];
    // 1. カレンダー取得
    try {
      const calResponse = await gapi.client.calendar.events.list({
        'calendarId': 'primary',
        'timeMin': (new Date()).toISOString(),
        'showDeleted': false,
        'singleEvents': true,
        'maxResults': 4,
        'orderBy': 'startTime'
      });
      schedules = (calResponse.result.items || []).map(i => i.summary || '予定あり');
    } catch (err) {
      errors.push("カレンダー取得失敗: " + (err.result ? err.result.error.message : err.message));
    }

    // 2. ToDo取得
    try {
      const taskResponse = await gapi.client.tasks.tasks.list({
        'tasklist': '@default',
        'showCompleted': false,
        'maxResults': 4
      });
      todos = taskResponse.result.items ? taskResponse.result.items : [];
    } catch (err) {
      errors.push("ToDo取得失敗: " + (err.result ? err.result.error.message : err.message));
    }

    if (errors.length > 0) {
      setStatus(errors.join("\n"));
    } else {
      setStatus("");
    }
    render();
  }

  function render() {
    const listView = document.getElementById('list-view');
    const memoView = document.getElementById('memo-view');
    if (currentMode === "STEALTH") {
      listView.style.display = "none"; memoView.style.display = "none"; return;
    }
    if (currentMode === "MEMO") {
      listView.style.display = "none"; memoView.style.display = "block";
      memoView.innerText = "【面談メモ】\nここにスマホから入力したメモが表示されます。";
    } else {
      listView.style.display = "block"; memoView.style.display = "none";
      let html = `<div class="item ${cursorIndex === 0 ? 'selected' : ''}">📄 面談メモを開く</div>`;
      html += `<div class="section-title">■ 予定</div>`;
      if (schedules.length === 0) html += `<div class="item">予定なし</div>`;
      schedules.forEach((title, idx) => {
        html += `<div class="item ${cursorIndex === idx+1 ? 'selected' : ''}">${title}</div>`;
      });
      html += `<div class="section-title">■ TELリスト</div>`;
      if (todos.length === 0) html += `<div class="item">タスクなし</div>`;
      todos.forEach((task, idx) => {
        html += `<div class="item ${cursorIndex === idx+1+schedules.length ? 'selected' : ''}">☐ ${task.title}</div>`;
      });
      listView.innerHTML = html;
    }
  }

  document.addEventListener('keydown', (e) => {
    let totalItems = 1 + schedules.length + todos.length;
    if(e.key === 'ArrowUp') { cursorIndex = Math.max(0, cursorIndex - 1); render(); }
    if(e.key === 'ArrowDown') { cursorIndex = Math.min(totalItems - 1, cursorIndex + 1); render(); }
    if(e.key === 'Enter') {
      if(currentMode === "STEALTH") { currentMode = "LIST"; render(); return; }
      if(cursorIndex === 0) { currentMode = "MEMO"; render(); }
      else if(cursorIndex > schedules.length) {
        let task = todos[cursorIndex - 1 - schedules.length];
        if (task) {
          gapi.client.tasks.tasks.update({ tasklist: '@default', task: task.id, resource: { id: task.id, status: 'completed' } }).then(() => {
            todos.splice(cursorIndex - 1 - schedules.length, 1);
            render();
          });
        }
      }
    }
    if(e.key === 'Backspace') {
      if(currentMode === "MEMO") currentMode = "LIST";
      else if(currentMode === "LIST") currentMode = "STEALTH";
      render();
    }
  });

  setInterval(() => {
    const d = new Date();
    document.getElementById('clock').innerText = `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }, 1000);
</script>
<!-- 重複していた上部スクリプトを削除し、下部1箇所のみに統一 -->
<script async defer src="https://apis.google.com/js/api.js" onload="gapiLoaded()"></script>
<script async defer src="https://accounts.google.com/gsi/client" onload="gisLoaded()"></script>
</body>
</html>
